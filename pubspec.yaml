name: linuxdojo
description: Offline Linux command flashcards with spaced repetition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.3
  fl_chart: ^1.3.0
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^3.5.0
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/iOS/AppIcon.appiconset/AppIcon-1024.png
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/icons/iOS/AppIcon.appiconset/AppIcon-1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/decks/
    - assets/icons/iOS/AppIcon.appiconset/AppIcon-1024.png
